name: Baixar criativos oficiais
on:
  push:
    paths: ['.github/workflows/fetch-promos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          set -e
          mkdir -p promos
          B=https://1win-partners.com/imgproxy
          curl -fsSL -o promos/hero-src.jpg "$B/quality/promo-files-uploads/c065cebe70ef7d00f8fad828044965ed8304cd80911b59bde6.jpg"
          while IFS='|' read -r name file; do
            curl -fsSL -o "promos/$name.${file##*.}" "$B/size_768/promo-files-uploads/$file" || echo "falhou: $name"
          done <<'LIST'
          worlds|1e09a294345d03908704061ca7428dc590415a85dc52808af7.jpg
          plinko|f7251a3553e9d044346515e65e1026e46332c56a8080ecbf43.jpg
          esports-freebets|0f0d77df0e8bdfb13ff37f4e553182e02bff96db426d7bfa17.jpg
          aviamasters|44668075c7427c8c6294249368b1f2c421d56c7c6db16d451b.jpg
          aviatrix|c7e5949c4fbe11a90d2ce1fda3f01a5bb7dcb97c677cc7b432.jpg
          luckydrive|bfee896a30ce28a18979e12eca8c75fdf002280b8f102b7769.jpg
          freebets|0280fda879aa678d6f708b97d613a1bec392c256fb2bc46161.jpg
          double|cec61658a1ec9a083b5d690806630ab6bd27c3e677e03515ca.jpg
          usdt2000|4917fa8118330a7963e5661591cdb37e939d4d3dbee3cb58c2.jpg
          formula1|6fc3d59f7b7f910bf1ee2118c0c0bbf34434c5548f70965242.jpg
          binary600|05c34d0e5fa7f7d08324435595b40a7f2ab3fb814e72dcb0bd.png
          crypto600|ad3050f8baf4d0a46d7f8c3086f3c616a4055739e77aca9d46.jpg
          speedcash|0a6963a82b2d227479783d975f6306534c8ec6e19cd60b2b56.jpg
          LIST
          ls -la promos
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promos
          git diff --cached --quiet || git commit -m "Criativos oficiais baixados do painel 1win"
          git push
